<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            display: none;
        }


        button:hover + p{
            display: block;
            color: red;


        }
    </style>
</head>
<body>
    <button>Hover Me</button>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quia temporibus, dicta sunt maxime obcaecati ducimus voluptates nihil alias cupiditate error.</p>
</body>
</html>
