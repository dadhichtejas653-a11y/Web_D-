<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        main{
            height: 100vh;
            width: 100vw;
            background-color: aqua;
        }
        ul{
            display: flex;
            justify-content: center;
            gap: 30px;
            align-items: center;
            height: 80px;
            font-size: 30px;
        }
        li{
            list-style: none;
        }
        header{
            box-shadow: 0 0 15px black;
            backdrop-filter: blur(42px);
        }
        section{
            height: 400px;
            width: 400px;
            box-shadow: 0 0 20px black;
            margin: 30px;
            border-radius: 15px;
            backdrop-filter: blur(30px);
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
    <main>
        <header>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Services</li>
                <li>Feedback</li>
            </ul>

        </header>
        <section>
            <h1>Kem Cho Mirai !!</h1>
            <a href="">Card</a>

        </section>

    </main>
</body>
</html>
