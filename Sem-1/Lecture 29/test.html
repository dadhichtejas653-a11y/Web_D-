<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body{
            background-color: #000000;
        }

        #head{
            margin-left: 45%;
            color: #9135fb;

        }
        #container{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            height: auto;
            width: 100%;
            gap: 30px;
            background-color: #000000;
        }

        .card{
            border: 1px solid black;
            border-radius: 10px;
            background-color:#e6d0f6;
            width: 400px;
            height: 330px;
            transition: 0.5s;
        }

        img{
            height: 200px;
            width: 150px;
            margin-left: 20%;
        }

        

        h3,p,img{
            margin-left: 5%;
            margin-top: 5%;
        }

    </style>
</head>
<body>
     <h1 id="head">Mirai Zone</h1>

    <section id="container">

        <div class="card"></div>

    </section>






    <script src="p1.js"></script>
    
</body>
</html>
